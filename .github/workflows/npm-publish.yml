name: Publish @kompo/kli to npm

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check tag matches package version
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag_version="${TAG_NAME#v}"
          package_version="$(bun -e "console.log(JSON.parse(await Bun.file('package.json').text()).version)")"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Tag $TAG_NAME does not match package.json version $package_version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test tests/

      - name: Configure npm authentication
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$NPM_TOKEN" || {
            echo "NPM_TOKEN repository secret is required for publishing" >&2
            exit 1
          }
          printf '%s\n' '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' > "$HOME/.npmrc"

      - name: Publish package
        run: bun publish --access public
