name: Contract tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run unit tests
        run: bun test tests/

      # Optional secrets enable the destructive compatibility gate. Without
      # them CI still runs the safe public/read-only contract tier.
      - name: Install private contract fixtures
        if: ${{ secrets.KOMPO_TEST_AUTH_JSON != '' && secrets.KOMPO_TEST_KOMPOSITION != '' }}
        env:
          KOMPO_TEST_AUTH_JSON: ${{ secrets.KOMPO_TEST_AUTH_JSON }}
          KOMPO_TEST_KOMPOSITION: ${{ secrets.KOMPO_TEST_KOMPOSITION }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kompo"
          printf '%s' "$KOMPO_TEST_AUTH_JSON" > "$HOME/.kompo/auth-test.json"
          printf '%s' "$KOMPO_TEST_KOMPOSITION" > "$RUNNER_TEMP/komposition.v3.kompo.md"
          chmod 600 "$HOME/.kompo/auth-test.json"

      - name: Run deployed contract tests (read-only)
        if: ${{ secrets.KOMPO_TEST_AUTH_JSON == '' || secrets.KOMPO_TEST_KOMPOSITION == '' }}
        run: bun run test:contract

      - name: Run deployed contract tests (full compatibility gate)
        if: ${{ secrets.KOMPO_TEST_AUTH_JSON != '' && secrets.KOMPO_TEST_KOMPOSITION != '' }}
        env:
          KOMPO_CONTRACT_MUTATING: '1'
          KOMPO_CONTRACT_FULL: '1'
          KOMPO_CONTRACT_KOMPOSITION_FILE: ${{ runner.temp }}/komposition.v3.kompo.md
        run: bun run test:contract
